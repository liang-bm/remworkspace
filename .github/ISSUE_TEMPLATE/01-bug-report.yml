name: Bug report
description: Report a reproducible problem. 中文、日本語での報告も歓迎します。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues first. For vulnerabilities or exposed credentials, follow [SECURITY.md](https://github.com/liang-bm/remworkspace/blob/main/SECURITY.md) instead of posting details here.
        Remove API keys, private records, voice files and personal paths from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: App version or source commit
      description: Give the app version, or the Git commit if you are running from source.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      description: Include the OS version. For Linux UI problems, say whether you use X11, Wayland or XWayland.
      placeholder: Windows 11, or Ubuntu 24.04 with XWayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small example with invented data. Which screen and buttons did you use?
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error text if available.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or logs
      description: Optional. Include only the small part needed to explain the problem, not a full configuration or database.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked existing issues and removed credentials and private information from this report and its attachments.
          required: true
